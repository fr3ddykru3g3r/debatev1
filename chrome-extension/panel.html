<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CutBase Clipper</title>
  <style>
    :root {
      --background: #09090b;
      --foreground: #fafafa;
      --border: #27272a;
      --muted: #a1a1aa;
      --emerald: #10b981;
      --amber: #f59e0b;
      --red: #ef4444;
    }

    body {
      background-color: var(--background);
      color: var(--foreground);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 16px;
      font-size: 13px;
      line-height: 1.5;
    }

    h1, h2, h3, h4 {
      margin: 0;
      font-weight: bold;
    }

    .header {
      font-family: monospace;
      font-size: 15px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 8px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .glass-card {
      background: rgba(20, 20, 25, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 6px;
      padding: 12px;
      margin-bottom: 12px;
    }

    label {
      display: block;
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 4px;
      text-transform: uppercase;
      font-family: monospace;
    }

    textarea, input, select {
      width: 100%;
      background-color: #18181b;
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--foreground);
      padding: 8px;
      box-sizing: border-box;
      font-size: 12px;
      margin-bottom: 10px;
      outline: none;
    }

    textarea:focus, input:focus {
      border-color: #52525b;
    }

    button {
      width: 100%;
      background-color: #fafafa;
      color: #18181b;
      border: none;
      border-radius: 4px;
      padding: 10px;
      font-weight: bold;
      cursor: pointer;
      font-family: monospace;
      text-transform: uppercase;
    }

    button:hover {
      background-color: #e4e4e7;
    }

    button:disabled {
      background-color: #27272a;
      color: #71717a;
      cursor: not-allowed;
    }

    .score-container {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px dashed rgba(255, 255, 255, 0.05);
    }

    .score-container:last-child {
      border-bottom: none;
    }

    .score-bar-bg {
      width: 60px;
      height: 6px;
      background-color: #27272a;
      border-radius: 3px;
      overflow: hidden;
    }

    .score-bar-fill {
      height: 100%;
      background-color: var(--emerald);
    }

    .score-value {
      font-family: monospace;
      font-weight: bold;
      width: 32px;
      text-align: right;
    }

    .verdict-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .readiness-pill {
      font-family: monospace;
      padding: 4px 8px;
      border-radius: 4px;
      font-weight: bold;
      font-size: 16px;
    }

    .pill-green { background-color: rgba(16, 185, 129, 0.15); color: var(--emerald); border: 1px solid rgba(16, 185, 129, 0.3); }
    .pill-yellow { background-color: rgba(245, 158, 11, 0.15); color: var(--amber); border: 1px solid rgba(245, 158, 11, 0.3); }
    .pill-red { background-color: rgba(239, 68, 68, 0.15); color: var(--red); border: 1px solid rgba(239, 68, 68, 0.3); }

    .tag-box {
      font-weight: 500;
      border-left: 2px solid var(--amber);
      background-color: rgba(245, 158, 11, 0.05);
      padding: 8px;
      border-radius: 0 4px 4px 0;
      margin-top: 8px;
    }

    .status-text {
      text-align: center;
      font-style: italic;
      color: var(--muted);
      font-family: monospace;
      margin: 20px 0;
    }
  </style>
</head>
<body>
  <div class="header">
    <span>// CUTBASE_CLIPPER</span>
    <span style="font-size: 10px; color: var(--muted);" id="api-status">API: Loading</span>
  </div>

  <div id="setup-panel" class="glass-card">
    <label for="server-url">Target Server</label>
    <input type="text" id="server-url" value="https://serene-hypatia.vercel.app">
  </div>

  <div id="clipper-panel" class="glass-card">
    <label for="claim-input">Claim / Tag</label>
    <textarea id="claim-input" rows="2" placeholder="Proposed debate claim/tag..."></textarea>

    <label for="evidence-preview">Selected Evidence</label>
    <textarea id="evidence-preview" rows="5" readonly placeholder="Right-click text on any site and select 'Evaluate Selection' to load..."></textarea>

    <label for="author-input">Metadata Year</label>
    <input type="text" id="author-input" placeholder="e.g. 2026">

    <button id="evaluate-btn" disabled>Evaluate Card</button>
  </div>

  <div id="status-display" class="status-text" style="display: none;">
    Evaluating evidence quality...
  </div>

  <div id="result-panel" class="glass-card" style="display: none;">
    <div class="verdict-header">
      <div>
        <h4 id="result-verdict" style="font-size: 12px; margin-bottom: 2px;">One Line Verdict</h4>
        <span id="result-meta" style="font-size: 10px; color: var(--muted); font-family: monospace;">Smith (2026)</span>
      </div>
      <div id="readiness-score" class="readiness-pill pill-green">8.5</div>
    </div>

    <div style="margin-top: 12px; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 8px;">
      <div class="score-container">
        <span>Claim Fit</span>
        <div style="display: flex; align-items: center; gap: 8px;">
          <div class="score-bar-bg"><div id="bar-fit" class="score-bar-fill"></div></div>
          <span id="score-fit" class="score-value">8.0</span>
        </div>
      </div>
      <div class="score-container">
        <span>Credibility</span>
        <div style="display: flex; align-items: center; gap: 8px;">
          <div class="score-bar-bg"><div id="bar-cred" class="score-bar-fill"></div></div>
          <span id="score-cred" class="score-value">8.0</span>
        </div>
      </div>
      <div class="score-container">
        <span>Recency</span>
        <div style="display: flex; align-items: center; gap: 8px;">
          <div class="score-bar-bg"><div id="bar-rec" class="score-bar-fill"></div></div>
          <span id="score-rec" class="score-value">8.0</span>
        </div>
      </div>
    </div>

    <div style="margin-top: 12px;">
      <label>Suggested Debate Tag Repair</label>
      <div id="suggested-tag" class="tag-box">
        Safer repaired tag here...
      </div>
    </div>
  </div>

  <script src="panel.js"></script>
</body>
</html>
